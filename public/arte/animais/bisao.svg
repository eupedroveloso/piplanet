    <!-- topete de lã entre os chifres -->
    <path d="M40 106 C38 90 50 78 60 80 C62 72 76 70 80 78 C90 74 102 84 98 98 C102 104 98 112 92 110 C86 116 80 110 76 114 C70 108 64 114 60 108 C54 114 46 112 46 106 C42 110 38 110 40 106 Z" fill="url(#bisao-la)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M52 92 q4 -4 8 0 M66 84 q4 -4 8 0 M80 92 q4 -4 8 0 M60 102 q4 -4 8 0 M76 102 q4 -4 8 0" fill="none" stroke="#a87448" stroke-width="1.6" opacity="0.8"/>
    <!-- focinho largo -->
    <path d="M46 148 C46 138 92 138 92 148 C92 162 82 170 69 170 C56 170 46 162 46 148 Z" fill="url(#bisao-focinho)" stroke="#2e1a0c" stroke-width="2.2"/>
    <path d="M54 144 Q66 140 78 141" fill="none" stroke="#9a7e70" stroke-width="2.4" opacity="0.9"/>
    <ellipse cx="58" cy="152" rx="4" ry="5" fill="#1e1410"/>
    <ellipse cx="80" cy="152" rx="4" ry="5" fill="#1e1410"/>
    <path d="M60 163 Q69 168 78 163" fill="none" stroke="#1e1410" stroke-width="2"/>
    <ellipse cx="40" cy="138" rx="7" ry="4.5" fill="#f4908a" opacity="0.5"/>
    <ellipse cx="98" cy="138" rx="7" ry="4.5" fill="#f4908a" opacity="0.5"/>
  </g>

  <g id="olhos">
    <ellipse cx="54" cy="124" rx="10.5" ry="11.5" fill="url(#bisao-iris)" stroke="#2e1a0c" stroke-width="1.5"/>
    <ellipse cx="84" cy="124" rx="10.5" ry="11.5" fill="url(#bisao-iris)" stroke="#2e1a0c" stroke-width="1.5"/>
    <ellipse cx="54.5" cy="124.5" rx="7.5" ry="9" fill="#2b1d16"/>
    <ellipse cx="84.5" cy="124.5" rx="7.5" ry="9" fill="#2b1d16"/>
    <circle cx="51" cy="120" r="4" fill="#fff"/>
    <circle cx="58" cy="128.5" r="1.9" fill="#fff"/>
    <circle cx="81" cy="120" r="4" fill="#fff"/>
    <circle cx="88" cy="128.5" r="1.9" fill="#fff"/>
  </g>
</svg>
