<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bisao-la" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#946038"/>
      <stop offset="0.55" stop-color="#5e3a1e"/>
      <stop offset="1" stop-color="#3a2212"/>
    </linearGradient>
    <linearGradient id="bisao-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c49260"/>
      <stop offset="0.55" stop-color="#9a6838"/>
      <stop offset="1" stop-color="#6e4422"/>
    </linearGradient>
    <linearGradient id="bisao-tras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4e2a"/>
      <stop offset="1" stop-color="#4e3018"/>
    </linearGradient>
    <radialGradient id="bisao-cabeca" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.6" stop-color="#5a3820"/>
      <stop offset="1" stop-color="#3a2414"/>
    </radialGradient>
    <linearGradient id="bisao-chifre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a6260"/>
      <stop offset="1" stop-color="#1e1a19"/>
    </linearGradient>
    <linearGradient id="bisao-focinho" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e5448"/>
      <stop offset="1" stop-color="#3e2c24"/>
    </linearGradient>
    <radialGradient id="bisao-iris" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#e2c494"/>
      <stop offset="1" stop-color="#a87a44"/>
    </radialGradient>
  </defs>

  <g id="sombra">
    <ellipse cx="136" cy="237" rx="100" ry="8" fill="#3b2a1a" opacity="0.18"/>
  </g>

  <g id="patas-tras" stroke-linejoin="round" stroke-linecap="round">
    <path d="M128 176 L128 224 L141 224 L142 176 Z" fill="url(#bisao-tras)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M196 160 C208 168 212 182 206 196 L206 224 L218 224 L220 194 C224 180 218 166 208 158 Z" fill="url(#bisao-tras)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M126 222 L143 222 L144 234 L125 234 Z M204 222 L220 222 L221 234 L203 234 Z" fill="#2a2220" stroke="#140f0d" stroke-width="2"/>
    <path d="M134.5 224 v10 M212.5 224 v10" stroke="#140f0d" stroke-width="1.5"/>
  </g>

  <g id="cauda" stroke-linejoin="round" stroke-linecap="round">
    <path d="M216 116 C226 124 228 146 226 168" fill="none" stroke="#4e3018" stroke-width="6"/>
    <path d="M216 116 C226 124 228 146 226 168" fill="none" stroke="#9a6838" stroke-width="2.5"/>
    <path d="M226 162 C218 166 218 184 226 190 C234 184 236 168 226 162 Z" fill="url(#bisao-la)" stroke="#2e1a0c" stroke-width="2"/>
    <path d="M224 170 l-1 12 M228 170 l1 12" stroke="#946038" stroke-width="1.3"/>
  </g>

  <g id="quartos" stroke-linejoin="round" stroke-linecap="round">
    <!-- traseira de cá, pelo curto e mais claro -->
    <path d="M168 150 C196 144 210 166 204 190 C202 198 198 204 198 212 L198 224 L184 224 L184 208 C186 200 186 196 184 190 C172 184 166 170 168 150 Z" fill="url(#bisao-pelo)"/>
    <path d="M184 224 L184 208 C186 200 186 196 184 190 M198 224 L198 212 C198 204 202 198 204 190 C208 176 204 164 196 156" fill="none" stroke="#4a2c14" stroke-width="2.5"/>
    <path d="M182 222 L199 222 L200 234 L181 234 Z" fill="#3a302c" stroke="#140f0d" stroke-width="2"/>
    <path d="M190.5 224 v10" stroke="#140f0d" stroke-width="1.5"/>
    <!-- corpo de trás -->
    <path d="M118 112 C150 96 192 98 212 110 C228 120 228 150 220 166 C212 180 198 184 186 182 L126 184 Z" fill="url(#bisao-pelo)" stroke="#4a2c14" stroke-width="2.5"/>
    <path d="M160 104 Q186 100 206 110" fill="none" stroke="#e2b884" stroke-width="3.5" opacity="0.8"/>
    <path d="M178 126 C200 120 216 136 212 158" fill="none" stroke="#6e4422" stroke-width="2" opacity="0.5"/>
    <g fill="none" stroke="#6e4422" stroke-width="1.5" opacity="0.7">
      <path d="M170 130 l3 5 M188 144 l3 5 M164 156 l3 5 M200 160 l2 5 M178 168 l3 5"/>
    </g>
  </g>

  <g id="la-frente" stroke-linejoin="round" stroke-linecap="round">
    <!-- corcova alta e lã densa da frente, com borda felpuda -->
    <path d="M64 120 C62 86 86 54 118 52 C138 52 152 64 158 80 C164 82 162 90 166 94 C172 98 166 106 172 112 C178 118 170 124 174 132 C178 140 170 144 172 152 C174 160 166 162 166 170 C164 178 156 178 152 184 C144 190 136 186 130 190 L96 190 C80 184 66 160 64 140 Z"
          fill="url(#bisao-la)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M82 88 Q96 62 120 58" fill="none" stroke="#b07a48" stroke-width="4" opacity="0.8"/>
    <!-- cachinhos de lã -->
    <g fill="none" stroke="#2e1a0c" stroke-width="1.8" opacity="0.65">
      <path d="M110 76 q5 -5 10 0 M130 70 q5 -5 10 0 M142 88 q5 -5 10 0 M120 96 q5 -5 10 0 M100 104 q5 -5 10 0 M146 110 q5 -5 10 0 M130 122 q5 -5 10 0 M148 136 q5 -5 10 0 M134 150 q5 -5 10 0 M146 164 q5 -5 10 0 M118 140 q5 -5 10 0 M124 170 q5 -5 10 0"/>
    </g>
    <g fill="none" stroke="#a87448" stroke-width="1.6" opacity="0.75">
      <path d="M100 74 q4 -4 8 0 M118 64 q4 -4 8 0 M90 92 q4 -4 8 0 M134 102 q4 -4 8 0 M110 118 q4 -4 8 0 M138 140 q4 -4 8 0"/>
    </g>
  </g>

  <g id="patas-frente" stroke-linejoin="round" stroke-linecap="round">
    <!-- canela fina -->
    <path d="M104 196 L104 224 L119 224 L120 196 Z" fill="url(#bisao-tras)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M102 222 L121 222 L122 234 L101 234 Z" fill="#3a302c" stroke="#140f0d" stroke-width="2"/>
    <path d="M111.5 224 v10" stroke="#140f0d" stroke-width="1.5"/>
    <!-- "calça" de lã na perna da frente -->
    <path d="M96 160 C112 156 128 162 128 176 C130 186 126 192 128 200 L122 198 L120 206 L114 200 L110 208 L106 200 L100 206 L98 196 C92 188 90 172 96 160 Z" fill="url(#bisao-la)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M102 170 q4 -4 8 0 M112 182 q4 -4 8 0 M100 188 q4 -4 8 0" fill="none" stroke="#a87448" stroke-width="1.6" opacity="0.8"/>
  </g>

  <g id="cabeca" stroke-linejoin="round" stroke-linecap="round">
    <!-- chifres curtos, curvos e pretos -->
    <path d="M38 112 C26 108 20 96 24 84 C30 90 36 94 46 98 Z" fill="url(#bisao-chifre)" stroke="#0e0b0a" stroke-width="2.2"/>
    <path d="M28 90 Q30 98 38 102" fill="none" stroke="#9a9290" stroke-width="1.8"/>
    <path d="M100 112 C112 108 118 96 114 84 C108 90 102 94 92 98 Z" fill="url(#bisao-chifre)" stroke="#0e0b0a" stroke-width="2.2"/>
    <!-- barba -->
    <path d="M50 160 C52 176 58 190 68 200 L72 192 L76 200 L80 192 C86 182 88 170 88 160 Z" fill="url(#bisao-la)" stroke="#2e1a0c" stroke-width="2.5"/>
    <path d="M60 168 l4 16 M70 168 l2 18 M80 168 l-1 14" fill="none" stroke="#a87448" stroke-width="1.5" opacity="0.8"/>
    <!-- cabeça enorme e baixa -->
    <path d="M69 92 C94 92 108 106 108 128 C108 146 100 160 88 168 C80 172 58 172 50 168 C38 160 30 146 30 128 C30 106 44 92 69 92 Z"
