    <g fill="#6e5e7a" opacity="0.8"><circle cx="44" cy="120" r="1.3"/><circle cx="48" cy="126" r="1.3"/><circle cx="40" cy="126" r="1.3"/><circle cx="116" cy="120" r="1.3"/><circle cx="112" cy="126" r="1.3"/><circle cx="120" cy="126" r="1.3"/></g>
    <ellipse cx="38" cy="116" rx="8" ry="5" fill="#f4908a" opacity="0.55"/>
    <ellipse cx="122" cy="116" rx="8" ry="5" fill="#f4908a" opacity="0.55"/>
