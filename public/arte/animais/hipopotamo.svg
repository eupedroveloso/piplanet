      <stop offset="0" stop-color="#c2b2c8"/>
      <stop offset="0.55" stop-color="#9c8aa4"/>
      <stop offset="1" stop-color="#6e5e7a"/>
    </linearGradient>
    <linearGradient id="hipopotamo-tras" x1="0" y1="0" x2="1" y2="1">
