    <ellipse cx="98" cy="106" rx="6" ry="3.5" fill="#4a3a52" transform="rotate(15 98 106)"/>
    <path d="M56 102 q6 -3 11 0 M93 102 q5 -3 11 0" fill="none" stroke="#c8b8cc" stroke-width="1.5"/>
