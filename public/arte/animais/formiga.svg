    <path d="M168 168 C186 154 216 158 224 178 C230 196 216 210 194 210 C174 210 160 198 160 184 C160 176 162 172 168 168 Z" fill="url(#formiga-gaster)" stroke="#6a2a12" stroke-width="2.5"/>
