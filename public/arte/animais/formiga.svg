    <ellipse cx="70" cy="184" rx="8" ry="5" fill="#f4908a" opacity="0.55"/>
    <path d="M52 182 Q58 188 66 186" fill="none" stroke="#6a2a12" stroke-width="2"/>
  </g>

  <g id="olhos">
    <ellipse cx="64" cy="164" rx="9" ry="10.5" fill="#2b1d16"/>
    <circle cx="60.5" cy="159.5" r="4.2" fill="#fff"/>
    <circle cx="68" cy="168.5" r="2" fill="#fff"/>
