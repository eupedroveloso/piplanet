<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="formiga-corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8935a"/>
      <stop offset="0.5" stop-color="#c55c2e"/>
      <stop offset="1" stop-color="#933c1d"/>
    </linearGradient>
    <radialGradient id="formiga-cabeca" cx="0.38" cy="0.3" r="0.85">
