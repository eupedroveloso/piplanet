    <path d="M84 140 l8 -10 l2 12 Z" fill="#c55c2e" stroke="#6a2a12" stroke-width="2"/>
    <path d="M94 150 l10 -6 l-2 12 Z" fill="#b04e26" stroke="#6a2a12" stroke-width="2"/>
