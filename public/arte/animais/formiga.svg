    <path d="M52 188 C42 190 34 186 30 178 C38 176 48 178 54 182 Z" fill="#933c1d" stroke="#4a1c0c" stroke-width="2"/>
    <path d="M36 168 l3 2 M35 181 l3 -1" stroke="#4a1c0c" stroke-width="1.5"/>
