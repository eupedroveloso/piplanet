  <g id="antena-de-ca" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- antena cotovelada -->
    <path d="M58 146 L52 118 L28 116" stroke="#6a2a12" stroke-width="6.5"/>
    <path d="M58 146 L52 118 L28 116" stroke="#cf6634" stroke-width="3.5"/>
    <circle cx="52" cy="118" r="3.2" fill="#e8935a" stroke="#6a2a12" stroke-width="1.6"/>
    <ellipse cx="26" cy="116" rx="5.5" ry="4.5" fill="#cf6634" stroke="#6a2a12" stroke-width="2"/>
