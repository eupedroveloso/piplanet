<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="golfinho-dorso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4c3d0"/>
      <stop offset="0.55" stop-color="#8197ab"/>
      <stop offset="1" stop-color="#5f7488"/>
    </linearGradient>
    <linearGradient id="golfinho-nadadeira" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93a7b9"/>
      <stop offset="1" stop-color="#5a6f83"/>
    </linearGradient>
    <linearGradient id="golfinho-barriga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ec"/>
    </linearGradient>
    <linearGradient id="golfinho-agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9edcf7"/>
      <stop offset="0.55" stop-color="#4fb0e3"/>
      <stop offset="1" stop-color="#2f86bd"/>
    </linearGradient>
    <clipPath id="golfinho-clip-corpo">
      <path d="M26 98 C28 90 36 86 46 84 C48 68 62 56 86 52 C134 42 184 62 206 112 L216 146 L202 150 C186 128 160 116 128 116 C100 116 80 118 62 116 C48 115 36 108 26 102 Z"/>
    </clipPath>
  </defs>

  <g id="sombra">
    <ellipse cx="128" cy="237" rx="92" ry="8" fill="#3b2a1a" opacity="0.18"/>
  </g>

  <g id="onda" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 236 C12 222 26 214 44 214 C62 214 72 222 92 220 C118 216 128 198 154 192 C180 188 202 198 212 214 C202 206 188 206 182 214 C196 218 220 212 236 214 C244 216 246 226 246 236 Z" fill="url(#golfinho-agua)" stroke="#23709f" stroke-width="2.5"/>
    <path d="M128 206 C138 198 152 194 168 194 C182 194 194 200 202 206" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M24 222 C34 216 46 216 58 220" fill="none" stroke="#e6f6ff" stroke-width="3.5"/>
    <path d="M40 230 q8 -4 16 0 M96 230 q8 -4 16 0 M150 226 q8 -4 16 0 M200 228 q8 -4 16 0" fill="none" stroke="#2f86bd" stroke-width="2"/>
    <!-- espuma e respingos -->
    <g fill="#ffffff" stroke="#7cc4ea" stroke-width="1.8">
      <circle cx="184" cy="214" r="5"/><circle cx="194" cy="210" r="4"/><circle cx="148" cy="194" r="4"/><circle cx="158" cy="191" r="3"/>
      <circle cx="226" cy="210" r="4"/><circle cx="216" cy="212" r="3"/>
      <path d="M200 186 q4 -9 8 0 q-4 7 -8 0 Z"/><path d="M240 196 q3 -7 6 0 q-3 5 -6 0 Z"/><path d="M186 194 q3 -6 6 0 q-3 5 -6 0 Z"/>
    </g>
  </g>

  <g id="golfinho" transform="translate(0 26)" stroke-linejoin="round" stroke-linecap="round">
    <!-- peitoral do lado de lá -->
    <path d="M112 112 C118 124 126 132 136 136 C136 126 130 116 124 112 Z" fill="#5a6f83" stroke="#3e5164" stroke-width="2.2"/>
    <!-- dorsal curva -->
    <path d="M116 50 C126 38 140 26 162 20 C152 32 152 44 160 58 Z" fill="url(#golfinho-nadadeira)" stroke="#3e5164" stroke-width="2.5"/>
    <path d="M128 42 Q140 32 152 26" fill="none" stroke="#c9d6e0" stroke-width="2.2"/>

    <!-- corpo -->
    <path d="M26 98 C28 90 36 86 46 84 C48 68 62 56 86 52 C134 42 184 62 206 112 L216 146 L202 150 C186 128 160 116 128 116 C100 116 80 118 62 116 C48 115 36 108 26 102 Z" fill="url(#golfinho-dorso)"/>
    <g clip-path="url(#golfinho-clip-corpo)">
      <!-- barriga clara -->
      <path d="M18 100 C40 104 62 98 84 94 C122 88 172 100 212 140 L230 200 L18 200 Z" fill="url(#golfinho-barriga)"/>
      <path d="M18 100 C40 104 62 98 84 94 C122 88 172 100 212 140" fill="none" stroke="#a9b8c5" stroke-width="1.6"/>
      <!-- capa mais escura no dorso -->
      <path d="M60 60 C100 44 160 52 196 96 C170 72 120 60 70 70 Z" fill="#6d8296" opacity="0.5"/>
      <!-- luz no melão e no dorso -->
      <path d="M52 76 Q60 62 78 58" fill="none" stroke="#e3ebf2" stroke-width="4.5"/>
      <path d="M98 54 Q130 48 160 58" fill="none" stroke="#d3dee8" stroke-width="3.5" opacity="0.8"/>
    </g>
    <path d="M26 98 C28 90 36 86 46 84 C48 68 62 56 86 52 C134 42 184 62 206 112 L216 146 L202 150 C186 128 160 116 128 116 C100 116 80 118 62 116 C48 115 36 108 26 102 Z" fill="none" stroke="#3e5164" stroke-width="2.5"/>
    <!-- cauda (nadadeira caudal horizontal) -->
    <path d="M206 144 C214 160 226 172 246 172 C238 162 232 154 230 146 C240 140 246 128 248 114 C232 120 220 130 212 138 Z" fill="url(#golfinho-nadadeira)" stroke="#3e5164" stroke-width="2.5"/>
    <path d="M216 146 Q228 160 240 166" fill="none" stroke="#c9d6e0" stroke-width="2"/>
    <!-- vinco do rostro / melão -->
    <path d="M46 84 Q52 88 54 94" fill="none" stroke="#3e5164" stroke-width="2"/>
    <!-- espiráculo -->
    <path d="M90 54 q4 -3 8 0" fill="none" stroke="#3e5164" stroke-width="2"/>
    <!-- sorriso natural -->
    <path d="M27 100 C38 104 50 104 60 98" fill="none" stroke="#3e5164" stroke-width="2.2"/>
    <path d="M60 98 q3 -1 4 -4" fill="none" stroke="#3e5164" stroke-width="2"/>
    <ellipse cx="70" cy="102" rx="7.5" ry="4.6" fill="#f4908a" opacity="0.55"/>

    <!-- peitoral -->
    <path d="M86 112 C88 128 96 140 112 146 C114 134 108 120 100 112 Z" fill="url(#golfinho-nadadeira)" stroke="#3e5164" stroke-width="2.5"/>
    <path d="M92 118 Q98 130 108 138" fill="none" stroke="#c9d6e0" stroke-width="2"/>
  </g>

  <g id="olhos" transform="translate(0 26)">
    <ellipse cx="72" cy="82" rx="9" ry="10.5" fill="#2b1d16"/>
    <circle cx="68.5" cy="77.5" r="4.2" fill="#fff"/>
    <circle cx="76" cy="86.5" r="2" fill="#fff"/>
  </g>

  <g id="assobios" transform="translate(0 24)" fill="none" stroke="#4fb0e3" stroke-width="3.2" stroke-linecap="round">
    <path d="M14 70 q5 -6 10 0 t10 0"/>
    <path d="M22 50 q5 -6 10 0 t10 0"/>
    <path d="M10 32 q4 -5 8 0 t8 0" stroke-width="2.6" opacity="0.8"/>
  </g>
</svg>
