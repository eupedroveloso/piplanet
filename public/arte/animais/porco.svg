<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="porco-pele" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2d4"/>
      <stop offset="0.55" stop-color="#f7a8b0"/>
      <stop offset="1" stop-color="#e07e8c"/>
    </linearGradient>
    <linearGradient id="porco-pata-tras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eda0a8"/>
      <stop offset="1" stop-color="#d07482"/>
