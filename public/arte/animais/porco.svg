    <radialGradient id="porco-cabeca" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffdadc"/>
      <stop offset="0.65" stop-color="#f8aab2"/>
      <stop offset="1" stop-color="#e48492"/>
