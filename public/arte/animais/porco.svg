    <ellipse cx="80" cy="116" rx="24" ry="17" fill="url(#porco-focinho)" stroke="#b8566a" stroke-width="2.5"/>
    <ellipse cx="80" cy="118" rx="20" ry="12" fill="none" stroke="#e07686" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="71" cy="117" rx="4.2" ry="6.5" fill="#a8445a"/>
    <ellipse cx="89" cy="117" rx="4.2" ry="6.5" fill="#a8445a"/>
    <ellipse cx="70" cy="114.5" rx="1.6" ry="2.4" fill="#d07482"/>
    <ellipse cx="88" cy="114.5" rx="1.6" ry="2.4" fill="#d07482"/>
