<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="boto-corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc9d6"/>
      <stop offset="0.55" stop-color="#f4a0b8"/>
      <stop offset="1" stop-color="#d97898"/>
    </linearGradient>
    <linearGradient id="boto-dorso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a99aae"/>
      <stop offset="1" stop-color="#d9a3b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boto-nadadeira" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6aec2"/>
      <stop offset="1" stop-color="#cf6f90"/>
    </linearGradient>
    <linearGradient id="boto-agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f2"/>
      <stop offset="1" stop-color="#3f9fd6"/>
    </linearGradient>
    <clipPath id="boto-clip">
      <path d="M14 148 Q30 138 48 132 C42 98 70 80 100 84 C130 88 156 108 184 100 C198 94 206 84 210 72 L224 80 C220 108 202 148 160 166 C120 182 76 180 60 162 Q40 158 14 152 Z"/>
    </clipPath>
  </defs>

  <g id="agua" stroke-linejoin="round" stroke-linecap="round">
    <path d="M22 220 Q42 210 62 220 T102 220 T142 220 T182 220 T222 220 Q234 214 240 220 L240 230 Q240 238 230 238 L32 238 Q22 238 22 230 Z"
          fill="url(#boto-agua)" stroke="#2f7fb0" stroke-width="2.5"/>
    <path d="M30 220 Q42 214 56 219 M90 218 Q102 212 116 219 M150 218 Q162 212 176 219 M204 218 Q214 213 226 218" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <path d="M48 230 h22 M100 232 h30 M160 230 h26 M206 232 h16" fill="none" stroke="#c4ecff" stroke-width="2" opacity="0.8"/>
    <!-- respingos -->
    <g fill="#bfe8fb" stroke="#4fa8d8" stroke-width="1.6">
      <path d="M92 206 Q96 198 100 206 Q100 211 96 211 Q92 211 92 206 Z"/>
      <path d="M150 202 Q153 196 156 202 Q156 206 153 206 Q150 206 150 202 Z"/>
      <path d="M200 200 Q204 192 208 200 Q208 205 204 205 Q200 205 200 200 Z"/>
      <path d="M232 196 Q235 190 238 196 Q238 200 235 200 Q232 200 232 196 Z"/>
      <circle cx="122" cy="208" r="2.5"/><circle cx="178" cy="208" r="2.2"/><circle cx="70" cy="210" r="2.2"/>
    </g>
  </g>

  <g id="boto" stroke-linejoin="round" stroke-linecap="round">
    <!-- nadadeira de lá -->
    <path d="M138 170 C146 184 158 194 170 192 C166 182 160 174 150 166 Z" fill="#d48aa3" stroke="#a5506f" stroke-width="2.5"/>
    <!-- cauda -->
    <path d="M211 76 C204 66 196 58 186 52 C200 46 214 52 220 62 C226 50 238 44 252 46 C248 58 238 72 224 82 Z" fill="url(#boto-nadadeira)" stroke="#a5506f" stroke-width="2.5"/>
    <path d="M208 64 Q200 56 192 53 M224 60 Q234 52 246 49" fill="none" stroke="#ffd0dc" stroke-width="2" opacity="0.8"/>
    <!-- corpo -->
    <path d="M14 148 Q30 138 48 132 C42 98 70 80 100 84 C130 88 156 108 184 100 C198 94 206 84 210 72 L224 80 C220 108 202 148 160 166 C120 182 76 180 60 162 Q40 158 14 152 Z" fill="url(#boto-corpo)" stroke="#a5506f" stroke-width="2.5"/>
    <g clip-path="url(#boto-clip)">
      <!-- dorso acinzentado -->
      <path d="M40 124 C54 92 100 78 130 94 C160 110 198 106 216 72 L240 40 L20 40 Z" fill="url(#boto-dorso)"/>
      <path d="M96 86 C124 90 150 108 180 102 L200 60 L90 60 Z" fill="#9c8ca3" opacity="0.4"/>
      <!-- barriga mais rosa -->
      <path d="M58 162 C96 180 160 168 196 134 C210 118 218 100 222 84 L260 90 L260 230 L30 230 Z" fill="#ffc3d3" opacity="0.9"/>
      <path d="M80 172 C112 180 158 168 190 140" fill="none" stroke="#ffe0e8" stroke-width="3" opacity="0.9"/>
      <!-- manchinhas rosadas -->
      <g fill="#e07f9f" opacity="0.5">
        <ellipse cx="128" cy="134" rx="5" ry="3"/><ellipse cx="146" cy="146" rx="3.5" ry="2.2"/><ellipse cx="166" cy="128" rx="4" ry="2.5"/><ellipse cx="108" cy="150" rx="3" ry="2"/><ellipse cx="188" cy="122" rx="3" ry="2"/><ellipse cx="140" cy="116" rx="3" ry="2"/>
      </g>
    </g>
    <!-- crista dorsal baixa e comprida -->
    <path d="M132 96 C142 90 154 92 164 102 C154 101 142 100 132 99 Z" fill="#ad98ad" stroke="#a5506f" stroke-width="2.2"/>
    <!-- luz na testa (melão) -->
    <path d="M56 112 Q66 90 92 86" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.65"/>
    <path d="M108 88 Q122 92 132 98" fill="none" stroke="#e8dce8" stroke-width="2.5" opacity="0.7"/>
    <!-- espiráculo -->
    <path d="M100 84 q5 -3 10 0" fill="none" stroke="#7d6a80" stroke-width="2"/>
    <!-- rostro longo -->
    <path d="M18 147 Q34 140 48 137" fill="none" stroke="#ffe0e8" stroke-width="2.2" opacity="0.9"/>
    <!-- boca sorrindo -->
    <path d="M14 151 Q38 154 56 153 Q63 151 66 146" fill="none" stroke="#a5506f" stroke-width="2.2"/>
    <!-- nadadeira peitoral larga -->
    <path d="M94 170 C94 190 106 206 126 208 C130 196 122 180 112 172 Z" fill="url(#boto-nadadeira)" stroke="#a5506f" stroke-width="2.5"/>
    <path d="M100 178 Q106 192 120 202" fill="none" stroke="#ffd6e0" stroke-width="2" opacity="0.9"/>
    <path d="M108 176 q6 6 8 14" fill="none" stroke="#c0668a" stroke-width="1.5" opacity="0.7"/>
    <!-- bochecha -->
    <ellipse cx="82" cy="146" rx="9" ry="5.5" fill="#f4908a" opacity="0.5"/>
    <!-- olho pequeno e simpático -->
    <ellipse cx="74" cy="128" rx="7" ry="8" fill="#2b1d16"/>
    <circle cx="71" cy="124.5" r="3.2" fill="#fff"/>
    <circle cx="77.5" cy="131.5" r="1.6" fill="#fff"/>
    <path d="M65 118 q6 -4 14 -1" fill="none" stroke="#a5506f" stroke-width="1.6"/>
  </g>

</svg>
