<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="pinguim-dorso" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ab8dc"/>
      <stop offset="0.55" stop-color="#5f83b4"/>
      <stop offset="1" stop-color="#3e5c8a"/>
    </linearGradient>
    <linearGradient id="pinguim-asa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a9cc8"/>
      <stop offset="1" stop-color="#3a5682"/>
    </linearGradient>
    <linearGradient id="pinguim-barriga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f1f3f6"/>
      <stop offset="1" stop-color="#d3d9e2"/>
    </linearGradient>
    <linearGradient id="pinguim-pe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe3e0"/>
      <stop offset="1" stop-color="#e9aeb0"/>
    </linearGradient>
    <linearGradient id="pinguim-pedra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9c6c0"/>
      <stop offset="0.55" stop-color="#9c978f"/>
      <stop offset="1" stop-color="#76716a"/>
    </linearGradient>
    <radialGradient id="pinguim-iris" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c3cad3"/>
    </radialGradient>
    <clipPath id="pinguim-clip-corpo">
      <path d="M124 50 C162 50 186 84 188 126 C190 170 176 208 130 210 C86 212 70 180 70 136 C70 92 88 50 124 50 Z"/>
    </clipPath>
  </defs>

  <g id="sombra">
    <ellipse cx="128" cy="237" rx="92" ry="8" fill="#3b2a1a" opacity="0.18"/>
  </g>

  <g id="pedra" stroke-linejoin="round" stroke-linecap="round">
    <path d="M36 236 C38 220 62 206 104 206 C150 204 202 210 220 236 Z" fill="url(#pinguim-pedra)" stroke="#5e5a54" stroke-width="2.5"/>
    <path d="M58 220 Q84 210 120 210" fill="none" stroke="#e4e1dc" stroke-width="3.5"/>
    <path d="M150 222 q12 -2 20 4 M90 228 q10 -3 18 0 M186 228 l8 -6" fill="none" stroke="#6e6a63" stroke-width="1.8"/>
    <g fill="#e8d9a8" stroke="#b8a46a" stroke-width="1"><ellipse cx="60" cy="234" rx="5" ry="2"/><ellipse cx="200" cy="234" rx="6" ry="2"/></g>
    <g fill="#8a857d"><circle cx="130" cy="226" r="1.5"/><circle cx="168" cy="216" r="1.3"/><circle cx="72" cy="226" r="1.3"/></g>
  </g>

  <g id="pinguim" stroke-linejoin="round" stroke-linecap="round">
    <!-- nadadeira de lá -->
    <path d="M78 122 C62 142 54 166 58 184 C70 180 80 162 84 144 Z" fill="url(#pinguim-asa)" stroke="#2a3c5e" stroke-width="2.5"/>
    <!-- pés rosados -->
    <g stroke="#b97478" stroke-width="2.2" fill="url(#pinguim-pe)">
      <path d="M108 204 C96 206 86 212 84 216 Q92 218 98 216 Q102 219 108 217 Q114 219 120 215 Q118 208 108 204 Z"/>
      <path d="M150 204 C140 206 132 212 130 216 Q138 218 144 216 Q148 219 154 217 Q160 219 166 215 Q164 208 150 204 Z"/>
    </g>
    <path d="M92 216 l-1 2 M100 217 l0 2 M138 216 l-1 2 M146 217 l0 2" stroke="#6a3b3e" stroke-width="2"/>

    <!-- corpo -->
    <path d="M124 50 C162 50 186 84 188 126 C190 170 176 208 130 210 C86 212 70 180 70 136 C70 92 88 50 124 50 Z" fill="url(#pinguim-dorso)"/>
    <g clip-path="url(#pinguim-clip-corpo)">
      <!-- face e barriga brancas -->
      <path d="M70 102 C84 100 96 104 110 104 C124 104 140 98 158 100 C170 120 172 160 164 186 C154 212 112 216 92 200 C76 186 70 160 70 140 Z" fill="url(#pinguim-barriga)"/>
      <!-- transição suave azul/branco -->
      <path d="M70 102 C84 100 96 104 110 104 C124 104 140 98 158 100" fill="none" stroke="#b9c7da" stroke-width="2"/>
      <!-- penas: escamado no peito -->
      <g fill="none" stroke="#c4ccd8" stroke-width="1.4">
        <path d="M96 140 q4 3 8 0 M112 134 q4 3 8 0 M128 140 q4 3 8 0 M144 134 q4 3 8 0 M104 156 q4 3 8 0 M120 152 q4 3 8 0 M136 156 q4 3 8 0 M112 172 q4 3 8 0 M128 172 q4 3 8 0 M100 188 q4 3 8 0 M140 186 q4 3 8 0"/>
      </g>
      <!-- penas: traços claros no dorso -->
      <g fill="none" stroke="#a9c3e2" stroke-width="1.5" opacity="0.8">
        <path d="M168 110 l4 4 M174 128 l4 4 M170 148 l4 4 M176 168 l3 4 M160 84 l4 3"/>
      </g>
      <path d="M94 70 Q108 56 128 56" fill="none" stroke="#c9dbf0" stroke-width="5" opacity="0.9"/>
    </g>
    <path d="M124 50 C162 50 186 84 188 126 C190 170 176 208 130 210 C86 212 70 180 70 136 C70 92 88 50 124 50 Z" fill="none" stroke="#2a3c5e" stroke-width="2.5"/>

    <!-- nadadeira de cá com borda clara -->
    <path d="M178 116 C198 136 208 166 202 188 C190 184 178 164 172 142 Z" fill="url(#pinguim-asa)" stroke="#2a3c5e" stroke-width="2.5"/>
    <path d="M184 128 C196 146 200 166 198 182" fill="none" stroke="#e8eef6" stroke-width="2.5"/>
    <path d="M180 126 Q186 132 190 140" fill="none" stroke="#a9c3e2" stroke-width="2"/>

    <!-- bochechas -->
    <ellipse cx="88" cy="114" rx="8" ry="5" fill="#f4908a" opacity="0.5"/>
    <ellipse cx="150" cy="112" rx="8" ry="5" fill="#f4908a" opacity="0.45"/>

    <!-- bico escuro, fino e ganchudo -->
    <path d="M126 94 C134 96 135 105 128 107 C118 109 106 110 98 110 C95 113 90 114 89 111 C88 107 94 103 100 100 C108 96 118 93 126 94 Z" fill="#3a3a46" stroke="#1f1f28" stroke-width="2.2"/>
    <path d="M98 108 C108 106 118 104 126 102" fill="none" stroke="#1f1f28" stroke-width="1.6"/>
    <path d="M104 100 Q114 96 124 97" fill="none" stroke="#7a7a8a" stroke-width="2"/>
    <ellipse cx="116" cy="100.5" rx="2" ry="1" fill="#1f1f28"/>
    <path d="M108 118 Q116 122 124 116" fill="none" stroke="#9aa6b6" stroke-width="1.8"/>
  </g>

  <g id="olhos">
    <!-- íris cinza-clara, típica do pinguim-azul -->
    <ellipse cx="96" cy="88" rx="12.5" ry="13.5" fill="url(#pinguim-iris)" stroke="#4a5568" stroke-width="2"/>
    <ellipse cx="142" cy="86" rx="12.5" ry="13.5" fill="url(#pinguim-iris)" stroke="#4a5568" stroke-width="2"/>
    <ellipse cx="97" cy="89" rx="8" ry="9.5" fill="#2b1d16"/>
    <ellipse cx="143" cy="87" rx="8" ry="9.5" fill="#2b1d16"/>
    <circle cx="93.5" cy="84.5" r="4.2" fill="#fff"/>
    <circle cx="101" cy="93.5" r="2" fill="#fff"/>
    <circle cx="139.5" cy="82.5" r="4.2" fill="#fff"/>
    <circle cx="147" cy="91.5" r="2" fill="#fff"/>
  </g>
</svg>
