    <clipPath id="gorila-clip-corpo">
      <path d="M94 96 C106 62 158 60 190 82 C214 98 230 124 228 150 C226 176 210 190 188 190 L140 190 C116 190 98 172 94 150 C92 130 90 110 94 96 Z"/>
