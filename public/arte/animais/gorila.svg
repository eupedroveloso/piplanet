      <stop offset="0.65" stop-color="#4a444c"/>
      <stop offset="1" stop-color="#322e34"/>
    </radialGradient>
    <radialGradient id="gorila-iris" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d6a46a"/>
      <stop offset="1" stop-color="#8a5a2e"/>
