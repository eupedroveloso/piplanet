      <path d="M146 70 C176 70 208 88 222 112 C234 132 232 150 222 162 L216 154 L212 162 L204 152 L198 158 L192 148 L184 152 L180 142 L172 144 L170 134 L162 134 L162 124 L154 122 L156 112 L148 108 L152 98 L144 94 L148 84 L140 80 Z" fill="url(#gorila-prata)"/>
