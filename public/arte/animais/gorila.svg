    <path d="M84 212 C82 226 86 234 98 234 L122 234 C130 234 130 222 124 212 Z" fill="url(#gorila-rosto)" stroke="#18161a" stroke-width="2.2"/>
    <path d="M94 224 q3 -4 6 0 M102 224 q3 -4 6 0 M110 224 q3 -4 6 0" fill="none" stroke="#7a727c" stroke-width="1.6"/>
