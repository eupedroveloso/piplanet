    <path d="M188 222 C186 206 180 194 178 180 M212 222 L214 192 C218 176 214 162 204 152" fill="none" stroke="#18161a" stroke-width="2.5"/>
    <path d="M196 160 Q208 162 210 176" fill="none" stroke="#8e8996" stroke-width="2.5" opacity="0.7"/>
    <path d="M184 220 C182 230 186 234 194 234 L216 234 C222 232 220 222 214 220 Z" fill="#3e3a40" stroke="#18161a" stroke-width="2.2"/>
