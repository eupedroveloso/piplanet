<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gorila-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76717c"/>
      <stop offset="0.55" stop-color="#4c4852"/>
      <stop offset="1" stop-color="#2c2a31"/>
    </linearGradient>
    <linearGradient id="gorila-tras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4650"/>
      <stop offset="1" stop-color="#26242a"/>
