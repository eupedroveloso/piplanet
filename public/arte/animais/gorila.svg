    <path d="M62 114 C62 104 70 100 76 100 C82 100 90 104 90 114 C90 120 84 122 76 122 C68 122 62 120 62 114 Z" fill="#3a343c" stroke="#18161a" stroke-width="2"/>
    <ellipse cx="69" cy="116" rx="4" ry="3" fill="#141214"/>
    <ellipse cx="83" cy="116" rx="4" ry="3" fill="#141214"/>
    <path d="M68 105 Q76 101 84 105" fill="none" stroke="#7a727c" stroke-width="1.6"/>
    <path d="M62 132 Q76 140 90 132" fill="none" stroke="#141214" stroke-width="2.2"/>
    <path d="M60 128 q-2 -2 -4 -1 M92 128 q2 -2 4 -1" fill="none" stroke="#141214" stroke-width="1.6"/>
    <ellipse cx="52" cy="116" rx="6" ry="4" fill="#f4908a" opacity="0.45"/>
    <ellipse cx="100" cy="116" rx="6" ry="4" fill="#f4908a" opacity="0.45"/>
  </g>

  <g id="olhos">
