    <path d="M46 88 C52 78 64 76 76 82 C88 76 100 78 106 88 C100 86 90 84 76 88 C62 84 52 86 46 88 Z" fill="#2a262c" stroke="#18161a" stroke-width="1.8"/>
    <path d="M54 82 Q64 78 72 81" fill="none" stroke="#7a727c" stroke-width="1.8"/>
