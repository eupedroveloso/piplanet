    <path d="M132 124 C126 154 128 190 132 214 L160 214 C160 190 164 160 168 132 Z" fill="url(#gorila-tras)" stroke="#18161a" stroke-width="2.5"/>
    <path d="M128 212 C126 226 130 234 140 234 L158 234 C166 234 166 222 160 212 Z" fill="#3a363c" stroke="#18161a" stroke-width="2.2"/>
