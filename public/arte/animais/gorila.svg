    <ellipse cx="62" cy="96.5" rx="8.5" ry="9.5" fill="url(#gorila-iris)"/>
    <ellipse cx="90" cy="96.5" rx="8.5" ry="9.5" fill="url(#gorila-iris)"/>
    <ellipse cx="62.5" cy="97" rx="5.8" ry="6.8" fill="#2b1d16"/>
    <ellipse cx="90.5" cy="97" rx="5.8" ry="6.8" fill="#2b1d16"/>
    <circle cx="58.5" cy="92.5" r="3.6" fill="#fff"/>
    <circle cx="65.5" cy="100.5" r="1.8" fill="#fff"/>
    <circle cx="86.5" cy="92.5" r="3.6" fill="#fff"/>
    <circle cx="93.5" cy="100.5" r="1.8" fill="#fff"/>
