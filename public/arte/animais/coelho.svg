<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="coelho-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cfab"/>
      <stop offset="0.55" stop-color="#d6a679"/>
      <stop offset="1" stop-color="#ac7850"/>
    </linearGradient>
    <linearGradient id="coelho-escuro" x1="0" y1="0" x2="1" y2="1">
