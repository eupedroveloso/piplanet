    <g fill="#b8845a" opacity="0.7"><circle cx="74" cy="104" r="1.2"/><circle cx="72" cy="109" r="1.2"/><circle cx="94" cy="104" r="1.2"/><circle cx="96" cy="109" r="1.2"/></g>
  </g>
