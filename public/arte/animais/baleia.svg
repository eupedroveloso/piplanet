<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="baleia-corpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a3c3dc"/>
      <stop offset="0.55" stop-color="#6a95bb"/>
      <stop offset="1" stop-color="#46719a"/>
    </linearGradient>
    <linearGradient id="baleia-nadadeira" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86aacb"/>
      <stop offset="1" stop-color="#456f97"/>
    </linearGradient>
    <linearGradient id="baleia-garganta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4eef5"/>
      <stop offset="1" stop-color="#bcd0e0"/>
    </linearGradient>
    <linearGradient id="baleia-agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9edcf7"/>
      <stop offset="1" stop-color="#3f9ad0"/>
    </linearGradient>
    <clipPath id="baleia-clip-corpo">
      <path d="M16 126 C18 106 48 94 90 94 C136 94 170 104 194 108 C206 110 214 102 220 92 L230 98 C226 116 212 134 196 146 C176 160 140 172 96 172 C54 172 18 162 16 142 Z"/>
    </clipPath>
  </defs>

  <g id="sombra">
    <ellipse cx="128" cy="237" rx="96" ry="8" fill="#3b2a1a" opacity="0.18"/>
  </g>

  <g id="esguicho" stroke-linejoin="round" stroke-linecap="round">
    <!-- jato em V saindo do espiráculo -->
    <g fill="#d4effc" stroke="#7cc4ea" stroke-width="2">
      <path d="M70 122 C66 102 60 84 54 62 C46 56 32 58 24 66 C42 82 58 102 63 122 Z"/>
      <path d="M66 122 C70 102 76 84 82 62 C90 56 104 58 112 66 C94 82 78 102 73 122 Z"/>
    </g>
    <path d="M62 112 C56 96 48 82 36 70 M74 112 C80 96 88 82 100 70" fill="none" stroke="#ffffff" stroke-width="3"/>
    <g fill="#ffffff" stroke="#7cc4ea" stroke-width="1.8">
      <circle cx="24" cy="60" r="5"/><circle cx="34" cy="54" r="5.5"/><circle cx="46" cy="54" r="5"/><circle cx="55" cy="60" r="4"/>
      <circle cx="81" cy="60" r="4"/><circle cx="90" cy="54" r="5"/><circle cx="102" cy="54" r="5.5"/><circle cx="112" cy="60" r="5"/>
    </g>
    <g fill="#9fd6f2">
      <circle cx="18" cy="44" r="3"/><circle cx="36" cy="40" r="2.5"/><circle cx="16" cy="76" r="2.5"/><circle cx="100" cy="40" r="2.5"/><circle cx="118" cy="44" r="3"/><circle cx="120" cy="76" r="2.5"/><circle cx="68" cy="48" r="3"/>
    </g>
  </g>

  <g id="baleia" transform="translate(0 24)" stroke-linejoin="round" stroke-linecap="round">
    <!-- nadadeira peitoral do lado de lá -->
    <path d="M70 160 C70 174 76 186 86 192 C90 182 88 170 82 162 Z" fill="#456f97" stroke="#2b4c6e" stroke-width="2.2"/>
    <!-- cauda larga com entalhe -->
    <path d="M225 96 C212 94 200 86 192 72 C206 70 218 76 225 86 C232 76 244 70 254 72 C248 86 238 94 226 96 Z" fill="url(#baleia-nadadeira)" stroke="#2b4c6e" stroke-width="2.5"/>
    <path d="M200 76 Q212 78 222 86 M228 86 Q238 78 248 76" fill="none" stroke="#c4d9ea" stroke-width="2"/>

    <!-- corpo -->
    <path d="M16 126 C18 106 48 94 90 94 C136 94 170 104 194 108 C206 110 214 102 220 92 L230 98 C226 116 212 134 196 146 C176 160 140 172 96 172 C54 172 18 162 16 142 Z" fill="url(#baleia-corpo)"/>
    <g clip-path="url(#baleia-clip-corpo)">
      <!-- garganta clara com pregas -->
      <path d="M10 140 C40 146 70 146 96 146 C124 146 150 150 170 160 L170 200 L10 200 Z" fill="url(#baleia-garganta)"/>
      <g fill="none" stroke="#88a6bf" stroke-width="1.5">
        <path d="M22 150 C60 154 110 154 160 164"/><path d="M26 156 C64 160 110 160 150 170"/><path d="M34 162 C70 166 104 166 136 174"/><path d="M46 168 C76 170 100 170 120 176"/>
      </g>
      <!-- manchinhas claras (mosqueado) -->
      <g fill="#c9dcec" opacity="0.75">
        <ellipse cx="110" cy="108" rx="4" ry="2.5"/><ellipse cx="126" cy="116" rx="3" ry="2"/><ellipse cx="142" cy="106" rx="4.5" ry="2.5"/><ellipse cx="150" cy="122" rx="3" ry="2"/><ellipse cx="164" cy="112" rx="3.5" ry="2.2"/><ellipse cx="174" cy="126" rx="3" ry="2"/><ellipse cx="98" cy="122" rx="3" ry="2"/><ellipse cx="186" cy="118" rx="2.5" ry="1.8"/><ellipse cx="132" cy="132" rx="3.5" ry="2"/><ellipse cx="160" cy="138" rx="3" ry="2"/>
      </g>
      <!-- luz no dorso -->
      <path d="M30 108 Q70 96 120 98" fill="none" stroke="#d3e5f2" stroke-width="5" opacity="0.85"/>
    </g>
    <path d="M16 126 C18 106 48 94 90 94 C136 94 170 104 194 108 C206 110 214 102 220 92 L230 98 C226 116 212 134 196 146 C176 160 140 172 96 172 C54 172 18 162 16 142 Z" fill="none" stroke="#2b4c6e" stroke-width="2.5"/>
    <!-- barbatana dorsal pequena, bem para trás -->
    <path d="M176 106 L188 96 L190 109 Z" fill="url(#baleia-nadadeira)" stroke="#2b4c6e" stroke-width="2.2"/>
    <!-- espiráculo com proteção -->
    <path d="M58 97 q9 -6 18 0" fill="#5d88b0" stroke="#2b4c6e" stroke-width="2"/>
    <path d="M64 96 l2 -2 M70 96 l-2 -2" stroke="#2b4c6e" stroke-width="1.6"/>
    <!-- boca longa -->
    <path d="M18 138 C40 142 62 142 82 138 Q88 136 90 130" fill="none" stroke="#2b4c6e" stroke-width="2.2"/>
    <ellipse cx="84" cy="146" rx="8" ry="4.8" fill="#f4908a" opacity="0.55"/>
    <!-- nadadeira peitoral -->
    <path d="M100 152 C104 170 114 184 132 192 C132 178 124 162 114 152 Z" fill="url(#baleia-nadadeira)" stroke="#2b4c6e" stroke-width="2.5"/>
    <path d="M106 158 Q114 172 126 184" fill="none" stroke="#c4d9ea" stroke-width="2"/>
  </g>

  <g id="olhos" transform="translate(0 24)">
    <ellipse cx="70" cy="122" rx="9" ry="10.5" fill="#2b1d16"/>
    <circle cx="66.5" cy="117.5" r="4.2" fill="#fff"/>
    <circle cx="74" cy="126.5" r="2" fill="#fff"/>
  </g>

  <g id="ondinhas" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 222 C14 212 26 210 34 216 C40 210 50 210 56 218 L56 228 L8 228 Z" fill="url(#baleia-agua)" stroke="#23709f" stroke-width="2.2"/>
    <path d="M196 220 C202 210 214 208 222 214 C228 208 240 208 248 216 L248 228 L196 228 Z" fill="url(#baleia-agua)" stroke="#23709f" stroke-width="2.2"/>
    <path d="M14 218 q6 -5 12 -2 M202 216 q6 -5 12 -2" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
