<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="canguru-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e99a68"/>
      <stop offset="0.55" stop-color="#c9673d"/>
      <stop offset="1" stop-color="#9c4626"/>
