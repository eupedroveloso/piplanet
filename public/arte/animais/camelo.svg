<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="camelo-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecc58e"/>
      <stop offset="0.55" stop-color="#c99660"/>
      <stop offset="1" stop-color="#9a6a3a"/>
    </linearGradient>
    <linearGradient id="camelo-tras" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8844e"/>
      <stop offset="1" stop-color="#8a5a30"/>
    </linearGradient>
    <radialGradient id="camelo-cabeca" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f2d09e"/>
      <stop offset="0.65" stop-color="#cf9c66"/>
      <stop offset="1" stop-color="#a6743e"/>
