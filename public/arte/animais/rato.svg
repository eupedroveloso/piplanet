<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rato-pelo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b8ac"/>
      <stop offset="0.55" stop-color="#9f9083"/>
      <stop offset="1" stop-color="#76685d"/>
    </linearGradient>
    <radialGradient id="rato-cabeca" cx="0.4" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#cfc4b8"/>
      <stop offset="0.65" stop-color="#a59688"/>
      <stop offset="1" stop-color="#83756a"/>
    </radialGradient>
    <linearGradient id="rato-barriga" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5ede4"/>
      <stop offset="1" stop-color="#d9cbbd"/>
