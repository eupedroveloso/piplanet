    <path d="M40 114 Q42 122 50 122 Q56 122 58 118" fill="none" stroke="#5a4d44" stroke-width="2"/>
    <path d="M44 121 L44 129 Q47.5 131 50 129 L50 122 Z M50 122 L50 129 Q53.5 131 56 128 L56 120 Z" fill="#fffdf6" stroke="#9a8a7c" stroke-width="1.5"/>
