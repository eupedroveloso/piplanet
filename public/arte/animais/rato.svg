    <linearGradient id="rato-rosa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc6c8"/>
      <stop offset="1" stop-color="#e98f97"/>
    </linearGradient>
    <radialGradient id="rato-orelha" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffb3b8"/>
      <stop offset="1" stop-color="#f08a94"/>
    </radialGradient>
    <clipPath id="rato-clip-corpo">
      <path d="M96 152 C100 122 140 108 172 116 C204 124 218 156 212 188 C208 214 186 228 156 228 L118 228 C98 228 90 210 92 190 Z"/>
    </clipPath>
  </defs>

  <g id="sombra">
