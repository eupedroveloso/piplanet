  <g id="focinho" stroke-linejoin="round" stroke-linecap="round">
    <!-- bigodes -->
    <g fill="none" stroke="#6e6058" stroke-width="1.5" opacity="0.85">
      <path d="M48 110 Q30 102 12 102"/><path d="M48 114 Q30 112 14 116"/><path d="M50 118 Q34 122 20 130"/>
      <path d="M62 112 Q76 108 90 110" opacity="0.6"/>
    </g>
    <ellipse cx="38" cy="108" rx="7.5" ry="6" fill="url(#rato-rosa)" stroke="#b86a74" stroke-width="2"/>
    <ellipse cx="36" cy="105.5" rx="2.6" ry="1.8" fill="#fff" opacity="0.85"/>
    <g fill="#8a6a60" opacity="0.7"><circle cx="54" cy="108" r="1.3"/><circle cx="58" cy="113" r="1.3"/><circle cx="52" cy="115" r="1.3"/></g>
