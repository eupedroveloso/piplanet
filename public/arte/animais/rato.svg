    <path d="M124 44 Q130 38 140 40" fill="none" stroke="#ffd8dc" stroke-width="2.5" opacity="0.9"/>
    <circle cx="68" cy="56" r="25" fill="url(#rato-cabeca)" stroke="#5a4d44" stroke-width="2.5"/>
    <circle cx="69" cy="58" r="16.5" fill="url(#rato-orelha)"/>
    <path d="M60 48 Q66 42 74 43" fill="none" stroke="#ffd8dc" stroke-width="2.5" opacity="0.9"/>
