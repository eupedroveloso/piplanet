    <ellipse cx="96" cy="116" rx="9" ry="5.5" fill="#f4908a" opacity="0.55"/>
    <ellipse cx="128" cy="112" rx="7" ry="4.5" fill="#f4908a" opacity="0.4"/>
  </g>

  <g id="olhos">
    <ellipse cx="74" cy="94" rx="9" ry="10.5" fill="#2b1d16"/>
    <ellipse cx="110" cy="92" rx="9" ry="10.5" fill="#2b1d16"/>
    <circle cx="70.5" cy="89.5" r="4.2" fill="#fff"/>
    <circle cx="78" cy="98.5" r="2" fill="#fff"/>
    <circle cx="106.5" cy="87.5" r="4.2" fill="#fff"/>
    <circle cx="114" cy="96.5" r="2" fill="#fff"/>
