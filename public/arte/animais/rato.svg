    <path d="M94 230 Q98 224 106 226 Q114 226 116 232 Q112 236 104 236 Q96 236 94 230 Z" fill="url(#rato-rosa)" stroke="#b86a74" stroke-width="2"/>
    <path d="M128 210 C128 222 128 228 126 230 Q134 236 142 232 C142 226 140 220 138 210 Z" fill="url(#rato-pelo)"/>
    <path d="M128 214 C128 222 128 228 126 230 M142 230 C142 226 140 220 138 214" fill="none" stroke="#5a4d44" stroke-width="2"/>
    <path d="M120 230 Q124 224 132 226 Q140 226 142 232 Q138 236 130 236 Q122 236 120 230 Z" fill="url(#rato-rosa)" stroke="#b86a74" stroke-width="2"/>
